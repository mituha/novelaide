[package]
name = "tauri-plugin-novelaid-mcp"
version = "0.1.0"
authors = [ "Mizuki Mituha" ]
description = "novelaide MCP (Model Context Protocol) external control server plugin"
edition = "2021"
rust-version = "1.88"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules", "/docs"]
links = "tauri-plugin-novelaid-mcp"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = "12.0"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
