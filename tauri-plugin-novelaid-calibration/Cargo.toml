[package]
name = "tauri-plugin-novelaid-calibration"
version = "0.2.0"
authors = [ "Mizuki Mituha" ]
description = "novelaide calibration and proofreading plugin"
edition = "2021"
rust-version = "1.88"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-novelaid-calibration"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
ts-rs = "12.0"
lindera = { version = "6", features = ["embed-ipadic"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
