[package]
name = "tauri-plugin-novelaid-fs"
version = "0.2.0"
authors = [ "Mizuki Mituha" ]
description = "novelaide filesystem plugin with frontmatter parsing and auto-generated TypeScript types"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-novelaid-fs"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2"
ts-rs = "12.0"
tokio = { version = "1", features = ["sync", "rt"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
