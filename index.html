<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.__novelaide_boot_start = performance.now();
      console.log('%c[Boot +   0.0ms] index.html inline script executed', 'color: #3b82f6; font-weight: bold;');
      window.addEventListener('DOMContentLoaded', () => {
        const ms = (performance.now() - window.__novelaide_boot_start).toFixed(1);
        console.log(`%c[Boot +${ms.padStart(6, ' ')}ms] DOMContentLoaded fired`, 'color: #3b82f6; font-weight: bold;');
      });
      window.addEventListener('load', () => {
        const ms = (performance.now() - window.__novelaide_boot_start).toFixed(1);
        console.log(`%c[Boot +${ms.padStart(6, ' ')}ms] window.load fired`, 'color: #3b82f6; font-weight: bold;');
      });

      // Node.js globals polyfill for browser compatibility
      window.global = window;
      window.process = {
        env: { NODE_ENV: 'production' },
        platform: 'win32',
        version: '',
        versions: {},
        cwd: () => '/',
        nextTick: (fn, ...args) => queueMicrotask(() => fn(...args)),
      };
    </script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>novelaide</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
