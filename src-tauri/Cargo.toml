[package]
name = "novelaide"
version = "0.31.0"
description = "novelaide - 小説執筆用エディター"
authors = ["Mizuki Mituha"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "novelaide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-novelaid-fs = { path = "../tauri-plugin-novelaid-fs" }
tauri-plugin-restar-settings = { path = "../tauri-plugin-restar-settings" }
tauri-plugin-restar-git = { path = "../tauri-plugin-restar-git" }
tauri-plugin-novelaid-ai = { path = "../tauri-plugin-novelaid-ai" }
tauri-plugin-novelaid-calibration = { path = "../tauri-plugin-novelaid-calibration" }
tauri-plugin-novelaid-ruby = { path = "../tauri-plugin-novelaid-ruby" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
