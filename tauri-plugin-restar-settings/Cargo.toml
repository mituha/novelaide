[package]
name = "tauri-plugin-restar-settings"
version = "0.1.0"
authors = [ "Mizuki Mituha" ]
description = "Restar application settings plugin with file persistence"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-restar-settings"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
