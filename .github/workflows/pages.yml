name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'making/notes/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Merge docs and making/notes for publication
        run: |
          mkdir -p public_site
          # 1. Copy docs/
          cp -r docs/* public_site/
          # 2. Dynamically merge making/notes into notes/
          mkdir -p public_site/notes
          cp -r making/notes/* public_site/notes/
          echo "Merged docs/ and making/notes/ successfully."
          ls -la public_site/

      - name: Escape Liquid syntax in Markdown for Jekyll
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          function sanitize(dir) {
            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, item.name);
              if (item.isDirectory()) {
                sanitize(full);
              } else if (item.name.endsWith('.md')) {
                let content = fs.readFileSync(full, 'utf8');
                let fm = '';
                let body = content;
                if (content.startsWith('---')) {
                  const second = content.indexOf('\n---', 3);
                  if (second !== -1) {
                    const fmEnd = second + 4;
                    fm = content.substring(0, fmEnd);
                    body = content.substring(fmEnd);
                  }
                }
                const sanitizedBody = body
                  .replaceAll('{{', '&#123;&#123;')
                  .replaceAll('{%', '&#123;%')
                  .replaceAll('%}', '%&#125;')
                  .replaceAll('}}', '&#125;&#125;');
                fs.writeFileSync(full, fm + sanitizedBody, 'utf8');
              }
            }
          }
          sanitize('public_site');
          console.log('Successfully sanitized Liquid syntax for all Markdown files in public_site.');
          "

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./public_site
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
